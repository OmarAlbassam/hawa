[project]
name = "hawa-llm"
version = "0.1.0"
description = "Hawa LLM sentiment analysis service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "httpx>=0.27.0",
    "aiolimiter>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
