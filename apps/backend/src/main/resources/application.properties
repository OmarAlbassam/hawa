spring.application.name=hawa-backend

# Database — PostgreSQL (override in profile-specific properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hawa}
spring.datasource.username=${DB_USERNAME:hawa}
spring.datasource.password=${DB_PASSWORD:hawa}

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/hawa}
spring.jpa.properties.jakarta.persistence.jdbc.user=${DB_USERNAME:hawa}
spring.jpa.properties.jakarta.persistence.jdbc.password=${DB_PASSWORD:hawa}

# Flyway
spring.flyway.enabled=true
