spring.application.name=hawa-backend

# Database — PostgreSQL (override in profile-specific properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hawa}
spring.datasource.username=${DB_USERNAME:hawa}
spring.datasource.password=${DB_PASSWORD:hawa}

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
