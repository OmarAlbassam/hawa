spring.application.name=hawa-backend

# Database — PostgreSQL (override in profile-specific properties)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hawa}
spring.datasource.username=${DB_USERNAME:hawa}
spring.datasource.password=${DB_PASSWORD:hawa}

# JPA
spring.jpa.open-in-view=false

# Hikari — keep small; Supabase free tier uses a shared session pooler with limited slots
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


# JWT
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==}
jwt.access-expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
# Liquibase

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# LLM service
hawa.llm.base-url=${LLM_BASE_URL:http://localhost:8001}
hawa.llm.timeout-ms=${LLM_TIMEOUT_MS:180000}
hawa.llm.batch-size=${LLM_BATCH_SIZE:25}

# Reddit (OAuth2 app-only)
hawa.reddit.client-id=${REDDIT_CLIENT_ID:}
hawa.reddit.client-secret=${REDDIT_CLIENT_SECRET:}
hawa.reddit.user-agent=${REDDIT_USER_AGENT:hawa-backend/0.1 (by u/unknown)}
hawa.reddit.base-url=${REDDIT_BASE_URL:https://oauth.reddit.com}
hawa.reddit.token-url=${REDDIT_TOKEN_URL:https://www.reddit.com/api/v1/access_token}
hawa.reddit.timeout-ms=${REDDIT_TIMEOUT_MS:15000}
hawa.reddit.max-post-chars=${REDDIT_MAX_POST_CHARS:10000}
hawa.reddit.page-size=${REDDIT_PAGE_SIZE:100}
hawa.reddit.comments-per-submission=${REDDIT_COMMENTS_PER_SUBMISSION:10}
hawa.reddit.max-search-scan=${REDDIT_MAX_SEARCH_SCAN:1000}

# Custom dataset upload (UC-08 / FR-02)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
hawa.datasets.max-rows=${DATASET_MAX_ROWS:10000}
